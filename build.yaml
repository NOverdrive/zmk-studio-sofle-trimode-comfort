---
include:
  - board: eyelash_sofle_dongle
    shield: nice_view
  - board: eyelash_sofle_left
    shield: nice_view_custom
  - board: eyelash_sofle_right
    shield: nice_view_custom
  - board: eyelash_sofle_dongle
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_studio_dongle
  - board: eyelash_sofle_dongle
    shield: settings_reset

 # Xiao_Dongle
  - board: seeeduino_xiao_ble
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"SofleDongle_X\" -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DKEYMAP_FILE=../../config/eyelash_sofle.keymap -DEXTRA_CONF_FILE=../../config/eyelash_sofle.conf
    artifact-name: xiao_sofle_dongle_xiao
    snippet: studio-rpc-usb-uart
  - board: seeeduino_xiao_ble
    shield: settings_reset

