---
include:

  - board: nice_nano_v2
    shield: sofle_left nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Sofle_Oled\"  -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000
    artifact-name: nice_sofle_left
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: sofle_right nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000
    artifact-name: nice_sofle_right
    
  # peripheral_left
  - board: nice_nano_v2
    shield: sofle_left_peripheral nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000
    artifact-name: nice_sofle_left_peripheral
    
  # Xiao_Dongle
  - board: xiao_ble_sense
    shield: sofle_dongle_xiao
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"SofleDongle_X\" -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000
    artifact-name: xiao_sofle_dongle_xiao
    snippet: studio-rpc-usb-uart
  - board: xiao_ble_sense
    shield: settings_reset

  - board: eyelash_sofle_left
    shield: nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: eyelash_sofle_right
    shield: nice_view_custom
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
