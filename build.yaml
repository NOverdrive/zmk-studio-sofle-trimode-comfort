---
include:
  #- board: eyelash_sofle_dongle
   # shield: nice_view
  - board: eyelash_sofle_left
    shield: nice_view nice_view_adapter Mirror_Gem
    snippet: studio-rpc-usb-uart
    #change the cmake to CENTRAL=Y when using without dongle
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    #artifact-name: overdrive_studio_left_central
    artifact-name: overdrive_studio_left_peripheral
  - board: eyelash_sofle_right
    shield: nice_view Hammerbeam
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: overdrive_studio_right_peripheral
  - board: eyelash_sofle_dongle
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: overdrive_studio_dongle
  - board: eyelash_sofle_dongle
    shield: settings_reset
    artifact-name: overdrive_settings_reset
